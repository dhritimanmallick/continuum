# Builds the Vyuhaa Continuum Android app.
#   - Every push to main: a debug APK you can install for testing.
#   - "Run workflow" (Actions tab) or a tag like v1.0.1: a signed release AAB for Google Play
#     plus a signed APK, when the upload-key secrets below are set.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64    base64 of continuum-upload.jks
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          continuum-upload
#   ANDROID_KEY_PASSWORD       key password
# Repository variable (optional):
#   CONTINUUM_API_BASE         hosted API the app talks to (default https://continuummcp.ai.studio)
name: Android app

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name shown on Play (e.g. 1.0.1)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build web app for Android
        env:
          VITE_APP_MODE: android
          VITE_API_BASE: ${{ vars.CONTINUUM_API_BASE || 'https://continuummcp.ai.studio' }}
        run: npx vite build

      - name: Copy web app into the Android project
        run: npx cap sync android

      - name: Version numbers
        id: ver
        run: |
          NAME="${{ github.event.inputs.version_name }}"
          if [ -z "$NAME" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then NAME="${GITHUB_REF#refs/tags/v}"; fi
          if [ -z "$NAME" ]; then NAME="1.0.$GITHUB_RUN_NUMBER"; fi
          # versionCode must increase on every Play upload; start above the first manual upload (1)
          echo "code=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Debug APK
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        working-directory: android
        env:
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Signed release AAB + APK
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        working-directory: android
        env:
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_* secrets to sign a release build."; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          ./gradlew bundleRelease assembleRelease --no-daemon
          rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: vyuhaa-continuum-${{ steps.ver.outputs.name }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
